services:
  - type: web
    name: conceptgraph-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Sessions are in memory: keep exactly one worker process.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_MODE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL_1
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL_2
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL_3
        value: gemini-2.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL_4
        value: gemini-2.5-flash
